<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ERDOS L40S — LIVE</title>
<style>
:root{--void:#05070a;--bone:#c8d0d8;--cyan:#00e5ff;--amber:#ffaa00;--blood:#ff2244;--green:#00ff88;--glass:rgba(8,12,18,0.88)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--bone);font-family:'Courier New',monospace;min-height:100vh;padding:24px}
h1{color:var(--cyan);font-size:18px;letter-spacing:3px;margin-bottom:20px;text-shadow:0 0 12px rgba(0,229,255,0.25)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--glass);border:1px solid rgba(0,229,255,0.12);padding:14px 16px}
.card .label{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:rgba(200,208,216,0.4);margin-bottom:6px}
.card .value{font-size:22px;font-weight:bold}
.card .value.cyan{color:var(--cyan)}
.card .value.amber{color:var(--amber)}
.card .value.blood{color:var(--blood)}
.card .value.green{color:var(--green)}

.bar-wrap{background:var(--glass);border:1px solid rgba(0,229,255,0.12);padding:16px;margin-bottom:20px}
.bar-label{display:flex;justify-content:space-between;font-size:10px;margin-bottom:8px;letter-spacing:1px}
.bar-outer{background:#0f141a;height:28px;border-radius:3px;overflow:hidden;border:1px solid rgba(0,229,255,0.15)}
.bar-inner{background:linear-gradient(90deg,var(--cyan),var(--green));height:100%;transition:width 0.8s;border-radius:2px;box-shadow:0 0 12px rgba(0,229,255,0.2)}
.bar-inner.paused{background:var(--amber);animation:blink 1s infinite}@keyframes blink{50%{opacity:.5}}

#status{font-size:10px;letter-spacing:2px;margin-bottom:16px}
#status.live{color:var(--green)}#status.stale{color:var(--amber)}#status.dead{color:var(--blood)}

.anomalies{margin-top:16px;padding:12px;border:1px solid var(--blood);background:rgba(255,34,68,0.06);display:none}
.anomalies.show{display:block}
.anomalies .label{color:var(--blood)}
.anomalies .list{font-size:10px;color:var(--blood);margin-top:6px;word-break:break-all}

.refresh{font-size:9px;color:rgba(200,208,216,0.3);margin-top:20px;text-align:right}
</style>
</head>
<body>
<h1>◈ ERDOS L40S — HOT CORRIDOR SIEVE</h1>
<div id="status" class="stale">◉ CONNECTING…</div>

<div class="grid">
  <div class="card"><div class="label">CANDIDATES</div><div class="value cyan" id="checked">--</div></div>
  <div class="card"><div class="label">SOLUTIONS</div><div class="value green" id="solutions">--</div></div>
  <div class="card"><div class="label">BREACH</div><div class="value blood" id="breach">--</div></div>
  <div class="card"><div class="label">STABLE</div><div class="value amber" id="stable">--</div></div>
  <div class="card"><div class="label">ANOMALIES</div><div class="value" id="anomalies" style="color:var(--bone)">--</div></div>
  <div class="card"><div class="label">RATE</div><div class="value cyan" id="rate">--</div></div>
  <div class="card"><div class="label">COST</div><div class="value amber" id="cost">--</div></div>
  <div class="card"><div class="label">LAST N</div><div class="value" id="lastn" style="color:var(--bone);font-size:16px">--</div></div>
</div>

<div class="bar-wrap">
  <div class="bar-label"><span id="barTitle">CHUNK PROGRESS</span><span id="barPct">0%</span></div>
  <div class="bar-outer"><div class="bar-inner" id="bar" style="width:0%"></div></div>
  <div class="bar-label" style="margin-top:6px;font-size:9px;color:rgba(200,208,216,0.3)">
    <span id="barDetail">--</span>
  </div>
</div>

<div class="anomalies" id="anomalyBox"><div class="label">⚠ ANOMALIES DETECTED</div><div class="list" id="anomalyList"></div></div>

<div class="refresh">REFRESH: <span id="refreshCount">0</span>s ago · <span id="source">erdos_output.json</span></div>

<script>
const OUTPUT_URL = 'erdos_output.json';
const REFRESH_MS = 8000;
let lastFetch = 0;

function fmt(n){return n!=null?Number(n).toLocaleString():'--'}
function fmtshort(n){if(n==null)return'--';if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n)}

async function load(){
  try{
    const r = await fetch(OUTPUT_URL+'?t='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    render(d);
    lastFetch = Date.now();
    document.getElementById('status').textContent = '● LIVE';
    document.getElementById('status').className = 'live';
  }catch(e){
    const age = (Date.now()-lastFetch)/1000;
    if(lastFetch===0){
      document.getElementById('status').textContent = '◉ NO DATA — run the sieve first';
      document.getElementById('status').className = 'dead';
    }else if(age>120){
      document.getElementById('status').textContent = '○ STALE ('+Math.floor(age)+'s)';
      document.getElementById('status').className = 'stale';
    }
  }
  updateRefreshTimer();
}

function render(d){
  const stats = d.stats || {};
  const checked = stats.total_checked || d.candidates_checked || 0;
  const stable = stats.stable || 0;
  const breach = stats.breach || 0;
  const sols = (d.solutions||[]).length || d.total_solutions || 0;
  const anomalies = d.anomalies||[];
  const nAnomalies = Array.isArray(anomalies)?anomalies.length:anomalies;
  const rate = d.rate_per_sec || 0;
  const lastN = d.last_n || 0;
  const chunkSize = d.chunk_size || 500000000;
  const startN = lastN - chunkSize;

  document.getElementById('checked').textContent = fmtshort(checked);
  document.getElementById('solutions').textContent = fmtshort(sols);
  document.getElementById('breach').textContent = fmtshort(breach);
  document.getElementById('stable').textContent = fmtshort(stable);
  document.getElementById('anomalies').textContent = fmtshort(nAnomalies);
  document.getElementById('rate').textContent = fmtshort(rate)+'/s';
  document.getElementById('lastn').textContent = fmtshort(lastN);

  // Cost estimate
  const costPerHr = d.cost_per_hr || 2.89;
  const elapsedHr = (Date.now() - new Date(d.timestamp||Date.now()).getTime())/3600000;
  document.getElementById('cost').textContent = '$'+Math.max(0,costPerHr*Math.max(0,elapsedHr||0.02)).toFixed(2);

  // Progress bar — use candidates_checked vs chunk candidates
  // Chunk candidates = chunk_size / 24 (stride)
  const chunkCandidates = Math.floor(chunkSize/24);
  const pct = Math.min(100, (checked % Math.max(1,chunkCandidates)) / Math.max(1,chunkCandidates) * 100);
  document.getElementById('bar').style.width = pct.toFixed(1)+'%';
  document.getElementById('barPct').textContent = pct.toFixed(1)+'%';
  document.getElementById('barDetail').textContent = 
    checked.toLocaleString()+' candidates · range ~'+(checked*24).toLocaleString();

  // Anomalies
  if(nAnomalies > 0){
    document.getElementById('anomalyBox').className = 'anomalies show';
    document.getElementById('anomalyList').textContent = 
      Array.isArray(anomalies) ? anomalies.slice(0,30).join(', ') : '';
  }else{
    document.getElementById('anomalyBox').className = 'anomalies';
  }
}

function updateRefreshTimer(){
  const elapsed = Math.floor((Date.now()-lastFetch)/1000);
  document.getElementById('refreshCount').textContent = lastFetch?elapsed:'--';
  if(elapsed>30 && lastFetch>0){
    document.getElementById('status').textContent = '○ STALE ('+elapsed+'s)';
    document.getElementById('status').className = 'stale';
  }
}

load();
setInterval(load, REFRESH_MS);
setInterval(updateRefreshTimer, 2000);
</script>
</body>
</html>
