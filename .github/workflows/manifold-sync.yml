name: Manifold Sync Daemon CI

on:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours
  workflow_dispatch:         # Allow manual trigger

jobs:
  manifold-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Commit ledger changes (targeted sync)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Only stage PREDICTION_LEDGER.md — no blind git add -A
          git add PREDICTION_LEDGER.md
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "sync: prediction ledger update $(date +%Y-%m-%d)"
            git pull --rebase
            git push
          else
            echo "No changes to PREDICTION_LEDGER.md — nothing to sync."
          fi
