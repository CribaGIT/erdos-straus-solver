name: Kaggle Publish

on:
  push:
    branches: [master]
    paths:
      - export_to_jsonl.py
      - generate_dashboard_json.py
      - sieve_l40s_hot_corridor.py
      - kernel-metadata.json
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install kaggle

      - name: Configure Kaggle API
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_API_TOKEN\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Export solutions to JSONL
        run: python export_to_jsonl.py

      - name: Generate dashboard JSON
        run: python generate_dashboard_json.py

      - name: Create Kaggle dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          kaggle datasets create -p kaggle_dataset/ --dir-mode zip --yes 2>/dev/null || \
          kaggle datasets version -p kaggle_dataset/ -m "auto-publish $(date +%Y-%m-%d)" --dir-mode zip

      - name: Push Kaggle kernel
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          kaggle kernels push --dry-run
          kaggle kernels push
