name: OEIS Verification

on:
  push:
    branches: [master]
    paths:
      - delta_analysis.py
      - final_verify.py
      - CONJECTURE.md
      - OEIS_SUBMISSION.md
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: pip install numpy

    - name: Run final verification
      run: python final_verify.py

    - name: Run delta analysis (small range)
      run: |
        python -c "
        import sys; sys.path.insert(0, '.')
        from delta_analysis import run_delta_analysis
        report = run_delta_analysis(max_n=10000, max_harmonics=50, max_k=50)
        assert report.omega_coverage == 100.0, 'Omega coverage must be 100%'
        assert report.neither_solved == 0, 'No unsolved cases'
        print('All assertions passed.')
        "

    - name: Verify OEIS sequence values
      run: |
        python -c "
        import sys; sys.path.insert(0, '.')
        from delta_analysis import omega_solve

        OEIS_A = [7, 11, 15, 19, 23, 31, 39, 43, 47, 51, 59, 67, 71, 79, 83, 87, 95, 103, 107, 111, 127, 159]

        def is_prime(n):
            if n < 2: return False
            if n % 2 == 0: return n == 2
            if n % 3 == 0: return n == 3
            d = 5
            while d * d <= n:
                if n % d == 0 or n % (d + 2) == 0:
                    return False
                d += 6
            return True

        def is_exceptional_prime(p):
            if p % 12 != 1:
                return False
            if not is_prime(p):
                return False
            c = (p + 3) // 4
            m = c
            q = 2
            while q * q <= m:
                if m % q == 0:
                    if q % 3 == 2:
                        return False
                    while m % q == 0:
                        m //= q
                q += 1 if q == 2 else 2
            if m > 1 and m % 3 == 2:
                return False
            return True

        count = 0
        p = 13
        while count < 100:
            if is_exceptional_prime(p):
                n = p * p
                A = None
                for m_val in range(200):
                    A_candidate = 4 * m_val + 3
                    if (n + A_candidate) % 4 == 0:
                        result = omega_solve(n, max_harmonics=m_val + 1)
                        if result and result['A'] == A_candidate:
                            A = A_candidate
                            break
                if A is not None and A not in OEIS_A:
                    print(f'FAIL: p={p}, A={A} not in OEIS set')
                    sys.exit(1)
                count += 1
            p += 2

        print(f'Verified {count} exceptional primes: all A in OEIS set.')
        print('OEIS verification PASSED.')
        "
